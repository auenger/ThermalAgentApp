appId: com.thermalagent.desktop
productName: Thermal Agent
directories:
  output: release
asar: true
afterPack: ./scripts/verify-electron-bundle.cjs
asarUnpack:
  - node_modules/**
  - plugins/**
files:
  - package.json
  - apps/desktop/dist/**
  - apps/core/dist/**
  - apps/web/dist/**
  - packages/*/dist/**
  - plugins/dsh-thermal/dist/**
  - plugins/dsh-thermal/package.json
  - plugins/icepak-pyaedt/python/**
  - plugins/report-reportlab/python/**
  - node_modules/**
extraResources:
  - from: scripts
    to: runtime-checks
    filter:
      - accept-installed-runtime.mjs
      - verify-windows-runtime.mjs
      - probe-windows-plugin-isolation.mjs
  - from: assets/cad
    to: cad-samples
  - from: scripts/accept-cad-model.mjs
    to: cad-acceptance/scripts/accept-cad-model.mjs
  - from: packages/contracts/dist
    to: cad-acceptance/packages/contracts/dist
  - from: packages/contracts/package.json
    to: cad-acceptance/packages/contracts/package.json
  - from: assets/brand
    to: brand
  - from: packaging/windows-runtime/node
    to: node
  - from: packaging/windows-runtime/python
    to: python
  - from: assets/icepak/Project1.aedt
    to: icepak-sample/Project1.aedt
win:
  icon: assets/brand/app.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: Thermal-Agent-${version}-Windows-x64.${ext}
